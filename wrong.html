<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오답노트 | 머호의 중국어 공부</title><style>

:root{
  --bg:#f7f8fc;
  --card:#ffffff;
  --text:#191d28;
  --muted:#737b8c;
  --border:#e7eaf1;
  --accent:#4568f2;
  --accent-soft:#eef2ff;
  --shadow:0 16px 45px rgba(34,45,85,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}
button,select,input{font:inherit}
button{cursor:pointer}
.shell{max-width:1060px;margin:0 auto;padding:34px 22px 70px}
.topnav{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:34px;
}
.brand{
  font-size:18px;font-weight:900;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px;
}
.brand-mark{
  width:38px;height:38px;border-radius:12px;background:var(--accent);
  color:white;display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:900;
}
.nav-home{
  border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:12px;
  font-weight:700;color:#4e5667;
}
.eyebrow{
  margin:0 0 10px;color:var(--accent);font-weight:900;font-size:12px;letter-spacing:.13em;
}
h1,h2,h3,p{word-break:keep-all}
.page-title{font-size:36px;margin:0 0 8px;letter-spacing:-.04em}
.page-sub{color:var(--muted);margin:0;line-height:1.65}

/* HOME */
.home-shell{min-height:100vh;display:flex;flex-direction:column}
.home-main{flex:1;display:flex;align-items:center}
.hero-wrap{width:100%}
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#151a2d 0%,#25345e 62%,#4568f2 100%);
  color:#fff;border-radius:32px;padding:54px 52px;box-shadow:var(--shadow);
  margin-bottom:22px;
}
.hero:after{
  content:"学";position:absolute;right:38px;bottom:-70px;
  font-size:250px;font-family:serif;font-weight:800;opacity:.08;
}
.hero .eyebrow{color:#bfcaff}
.hero h1{font-size:48px;letter-spacing:-.05em;margin:0 0 16px;position:relative;z-index:1}
.hero p{margin:0;color:#d9def0;font-size:17px;line-height:1.7;position:relative;z-index:1}
.hero-stats{
  margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1;
}
.stat-pill{
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.15);
  border-radius:999px;padding:10px 15px;font-size:14px;
}
.stat-pill strong{font-size:16px;margin-right:4px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.home-card{
  background:#fff;border:1px solid var(--border);border-radius:24px;
  padding:26px;min-height:220px;display:flex;flex-direction:column;
  box-shadow:0 8px 28px rgba(34,45,85,.045);
  transition:.18s ease;
}
.home-card:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(34,45,85,.09);border-color:#dbe1fa}
.card-icon{
  width:54px;height:54px;border-radius:16px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:27px;font-weight:900;margin-bottom:22px;
}
.home-card h2{font-size:22px;margin:0 0 9px;letter-spacing:-.03em}
.home-card p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}
.card-foot{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;font-weight:800}
.card-foot span:last-child{font-size:21px;color:#9ba3b5}

/* STUDY */
.page-head{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px;
}
.ghost{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;color:#4d5566}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stats div{background:#fff;border:1px solid var(--border);border-radius:17px;padding:18px;text-align:center}
.stats strong{display:block;font-size:25px}.stats span{font-size:13px;color:var(--muted)}
.study-panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.controls{display:flex;gap:10px}
select{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;color:#4d5566}
.card{
  min-height:350px;margin:20px 0;background:linear-gradient(180deg,#fbfcff,#f5f7ff);
  border:1px solid #e5e9ff;border-radius:22px;padding:42px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px
}
.hanzi{font-size:68px;font-weight:900;letter-spacing:.03em}
.pinyin{font-size:27px;color:var(--accent);font-weight:800}
.meaning{font-size:23px;font-weight:700}
.hidden{visibility:hidden}
.reveal{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:9px 15px;font-weight:800}
.voice-hint{font-size:12px;color:var(--muted);margin-top:-8px}
.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.rate{border:0;border-radius:14px;padding:14px;font-weight:900}
.unknown{background:#fff0f0;color:#c74242}.unsure{background:#fff7df;color:#9a6900}.known{background:#eaf8ef;color:#27814a}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px;font-weight:800}
.list-section,.wrong-section{margin-top:28px}
.list-header,.wrong-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:13px}
.list-header h2,.wrong-header h2{margin:0}
.list-header input{width:300px;max-width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 13px;background:#fff}
.word-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.word-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center}
.word-item .hz{font-size:22px;font-weight:900}.word-item .py{color:var(--accent);font-size:14px}.word-item .mn{color:#50586a;font-size:14px;margin-top:3px}
.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#f0f2f6;color:#6e7584}

/* WRONG */
.wrong-section{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.wrong-header p{margin:5px 0 0;color:var(--muted);font-size:14px}
.wrong-count{background:#fff0f0;color:#c74242;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:900}
.wrong-add{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;margin-bottom:16px}
.wrong-add input{border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:#fff;min-width:0}
.wrong-add button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:900}
.wrong-list{display:grid;gap:10px}
.wrong-item{border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center}
.wrong-item .hz{font-size:24px;font-weight:900}.wrong-item .py{color:var(--accent);font-size:14px;font-weight:800}.wrong-item .mn{color:#50586a;font-size:14px;margin-top:3px}
.wrong-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wrong-actions button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800}
.wrong-actions .learned{background:#eaf8ef;color:#27814a;border-color:#d6efdf}
.wrong-actions .edit{background:#eef2ff;color:var(--accent);border-color:#dfe5ff}
.wrong-actions .delete{background:#fff0f0;color:#c74242;border-color:#f4dada}
.wrong-empty{text-align:center;color:var(--muted);padding:34px 12px;border:1px dashed var(--border);border-radius:14px}

/* SENTENCE */
.coming{
  background:#fff;border:1px solid var(--border);border-radius:26px;padding:70px 25px;text-align:center;box-shadow:var(--shadow)
}
.coming-icon{width:84px;height:84px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;margin:0 auto 18px}
.coming h2{font-size:25px;margin:0 0 10px}.coming p{margin:0;color:var(--muted);line-height:1.7}

@media(max-width:760px){
  .shell{padding:22px 14px 50px}
  .hero{padding:38px 26px;border-radius:26px}.hero h1{font-size:38px}
  .menu-grid{grid-template-columns:1fr}
  .home-card{min-height:170px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .page-head{flex-direction:column}
  .topline{align-items:flex-start;flex-direction:column;gap:12px}
  .controls{width:100%}.controls>*{flex:1}
  .hanzi{font-size:54px}.card{min-height:320px}
  .word-list{grid-template-columns:1fr}.word-item{grid-template-columns:88px 1fr auto}
  .list-header{align-items:flex-start;flex-direction:column}.list-header input{width:100%}
  .wrong-add{grid-template-columns:1fr}
  .wrong-item{grid-template-columns:82px 1fr}.wrong-actions{grid-column:1/-1;justify-content:stretch}.wrong-actions button{flex:1}
}


.sentence-tabs{display:flex;gap:10px;margin:22px 0}
.sentence-tab{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 18px;font-weight:900;color:#5b6475}
.sentence-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.sentence-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sentence-toolbar .group{display:flex;gap:9px;flex-wrap:wrap}
.sentence-card{background:#fff;border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
.sentence-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:24px}
.sentence-badges{display:flex;gap:7px;flex-wrap:wrap}
.sbadge{padding:6px 9px;border-radius:999px;background:#f0f2f6;font-weight:800}
.sentence-cn{font-size:34px;font-weight:900;line-height:1.55;letter-spacing:.01em;text-align:center;margin:34px 0 20px}
.sentence-pinyin{font-size:20px;line-height:1.7;color:var(--accent);font-weight:800;text-align:center;margin:14px 0}
.sentence-meaning{font-size:20px;line-height:1.65;text-align:center;font-weight:700;margin:14px 0}
.sentence-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.sentence-actions button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:10px 16px;font-weight:900}
.focus-box{margin-top:24px;border-top:1px solid var(--border);padding-top:18px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.focus-box span{font-size:13px;color:var(--muted)}
.focus-word{background:#fff7df;color:#8f6300;padding:7px 11px;border-radius:999px;font-weight:900}
.sentence-rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sentence-rate button{border:0;border-radius:14px;padding:13px;font-weight:900}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.snav button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px;font-weight:900}
.progress-track{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:15px 0 24px}
.progress-bar{height:100%;background:var(--accent);width:0}
.quiz-panel{background:#fff;border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.quiz-type{font-size:13px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:7px 10px;border-radius:999px}
.quiz-question{font-size:27px;font-weight:900;line-height:1.55;margin:28px 0;text-align:center}
.quiz-sub{color:var(--muted);text-align:center;margin-top:-14px;margin-bottom:24px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{border:1px solid var(--border);background:#fff;border-radius:15px;padding:15px;text-align:left;font-weight:800;line-height:1.45}
.option:hover{border-color:#cfd7ff;background:#fafbff}
.option.correct{background:#eaf8ef;border-color:#c9e8d5;color:#247343}
.option.wrong{background:#fff0f0;border-color:#efd1d1;color:#b63b3b}
.quiz-feedback{margin-top:16px;padding:14px 16px;border-radius:14px;background:#f7f8fb;line-height:1.6;display:none}
.quiz-next{width:100%;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-weight:900;margin-top:14px;display:none}
.token-bank,.answer-bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:58px;padding:12px;border-radius:15px;border:1px dashed var(--border);margin:12px 0}
.token{border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px 12px;font-weight:900}
.answer-bank{background:#fafbff;border-style:solid}
.quiz-mode-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.quiz-mode-card{border:1px solid var(--border);background:#fff;border-radius:16px;padding:14px;text-align:center;font-weight:900}
.quiz-mode-card.active{border-color:#cbd4ff;background:var(--accent-soft);color:var(--accent)}
.listen-btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:12px 18px;font-weight:900;display:block;margin:8px auto 22px}
.hidden-block{display:none!important}
.today-box{margin-top:18px;background:#fff;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.10);border-radius:18px;padding:15px 17px;position:relative;z-index:1}
.today-box .label{font-size:12px;color:#cdd5ff;font-weight:900;margin-bottom:5px}
.today-box .cn{font-size:18px;font-weight:900}
.today-box .ko{font-size:13px;color:#d9def0;margin-top:5px}
@media(max-width:760px){
 .sentence-cn{font-size:27px}.options{grid-template-columns:1fr}.quiz-mode-cards{grid-template-columns:1fr 1fr}
 .sentence-card,.quiz-panel{padding:20px}
}

.review-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.review-tab{border:1px solid var(--border);background:#fff;border-radius:13px;padding:11px 15px;font-weight:900;color:#596273}
.review-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.review-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.review-summary div{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.review-summary strong{display:block;font-size:23px}.review-summary span{font-size:12px;color:var(--muted)}
.review-stack{display:grid;gap:18px}
.review-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 8px 28px rgba(34,45,85,.05)}
.review-card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.review-source{font-size:12px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:6px 9px;border-radius:999px}
.review-count{font-size:12px;color:var(--muted)}
.review-word-cn{font-size:52px;font-weight:900;text-align:center;margin:25px 0}
.review-hidden{display:none}
.review-center{text-align:center}
.review-reveal{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:9px 14px;font-weight:900;margin:5px}
.review-pinyin{font-size:23px;color:var(--accent);font-weight:900;margin:12px 0}
.review-meaning{font-size:20px;font-weight:800;margin:12px 0}
.review-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.review-actions button{border:0;border-radius:13px;padding:12px;font-weight:900}
.keep-btn{background:#fff0f0;color:#b93e3e}.resolve-btn{background:#eaf8ef;color:#267847}
.review-sentence{font-size:29px;line-height:1.55;font-weight:900;text-align:center;margin:28px 0 18px}
.review-focus{text-align:center;margin:14px 0}.review-focus span{background:#fff7df;color:#8c6200;padding:7px 10px;border-radius:999px;font-weight:900}
.review-quiz-q{font-size:24px;font-weight:900;line-height:1.55;text-align:center;margin:24px 0}
.review-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-option{border:1px solid var(--border);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:800}
.review-option.correct{background:#eaf8ef;border-color:#c8e7d3;color:#247343}
.review-option.wrong{background:#fff0f0;border-color:#efd0d0;color:#b83e3e}
.review-token-bank,.review-answer-bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:54px;border:1px dashed var(--border);border-radius:14px;padding:11px;margin:10px 0}
.review-answer-bank{border-style:solid;background:#fafbff}
.review-token{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 11px;font-weight:900}
.review-feedback{margin-top:13px;padding:13px;border-radius:13px;background:#f7f8fb;line-height:1.6}
.review-empty{background:#fff;border:1px dashed var(--border);border-radius:22px;padding:55px 20px;text-align:center;color:var(--muted)}
.manual-add{margin-top:24px;background:#fff;border:1px solid var(--border);border-radius:22px;padding:20px}
.manual-add h3{margin-top:0}
.wrong-add{margin-bottom:0}
@media(max-width:760px){.review-summary{grid-template-columns:1fr 1fr}.review-options{grid-template-columns:1fr}.review-sentence{font-size:24px}}

.grammar-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.grammar-actions button{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 13px;font-weight:900;color:#566073}
.grammar-box{margin-top:15px;border:1px solid var(--border);background:#fafbff;border-radius:16px;padding:15px}
.grammar-box h3{margin:0 0 12px;font-size:15px}
.tag-row{display:flex;gap:8px;flex-wrap:wrap}
.grammar-tag{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px}
.grammar-tag strong{color:var(--accent);margin-right:5px}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pos-item{background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 10px}
.pos-item .word{font-weight:900;font-size:16px}
.pos-item .ptype{color:var(--muted);font-size:12px;margin-top:3px}
@media(max-width:760px){.pos-grid{grid-template-columns:repeat(2,1fr)}}


.quiz-explain{margin-top:14px;border:1px solid #e3e7f3;background:#fbfcff;border-radius:15px;padding:15px;line-height:1.7}
.quiz-explain-title{font-weight:900;margin-bottom:8px}
.quiz-explain-row{margin:5px 0}
.quiz-explain-row strong{display:inline-block;min-width:72px;color:#4b5568}
.quiz-pinyin{color:var(--accent);font-weight:800}
.quiz-explain-listen{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-weight:900;margin-top:8px}


/* v30 shared Chinese-inspired accents */
:root{--accent:#b3261e;--accent-soft:#fff0ea}
body{
  background:
    radial-gradient(circle at 12% 7%,rgba(214,168,75,.08),transparent 23%),
    #f7f3ec !important;
}
.brand-mark{background:linear-gradient(145deg,#b3261e,#d74732)!important;box-shadow:0 6px 16px rgba(179,38,30,.22)}
.topnav .brand{color:#251d18!important}
.today-hero,.listen-hero,.sentence-hero,.word-hero{
  background:linear-gradient(125deg,#17191f 0%,#2c211a 52%,#861d16 100%)!important;
  border:1px solid rgba(214,168,75,.25);
}
.today-tab.active{
  background:#b3261e!important;
}
.today-option.correct,.listen-option.correct{background:#eaf8ef!important}
.today-progress,.progress-bar{background:#b3261e!important}
.quiz-type,.eyebrow{color:#b3261e}


/* ===== v45 clickable brand home link ===== */
.brand-home-link,
a.brand{
  text-decoration:none !important;
  color:inherit !important;
  cursor:pointer;
}
.brand-home-link:hover,
a.brand:hover{
  opacity:.88;
}
.brand-home-link:focus-visible,
a.brand:focus-visible{
  outline:2px solid #b3261e;
  outline-offset:4px;
  border-radius:10px;
}

<body>
<main class="shell">

<div class="page-head"><div><p class="eyebrow">SMART REVIEW</p><h1 class="page-title">오답노트</h1><p class="page-sub">단어와 문장에서 모른다고 체크한 항목, HSK 연습에서 틀린 문제를 그때의 형태 그대로 다시 풀어보세요.</p></div></div>

<section class="review-summary">
 <div><strong id="allReviewCount">0</strong><span>전체 오답</span></div>
 <div><strong id="wordReviewCount">0</strong><span>단어</span></div>
 <div><strong id="sentenceReviewCount">0</strong><span>문장</span></div>
 <div><strong id="quizReviewCount">0</strong><span>HSK 문제</span></div>
</section>
<div class="review-tabs">
 <button class="review-tab active" data-filter="all">전체</button>
 <button class="review-tab" data-filter="word">단어 공부</button>
 <button class="review-tab" data-filter="sentence">문장 공부</button>
 <button class="review-tab" data-filter="quiz">HSK 문제</button>
</div>
<div id="reviewStack" class="review-stack"></div>
<div id="reviewEmpty" class="review-empty">아직 저장된 오답이 없어요.<br>단어에서 ‘모름’, 문장에서 ‘다시 보기’, HSK 문제에서 오답을 선택하면 여기에 자동 저장됩니다.</div>

<section class="manual-add">
 <h3>직접 단어 추가</h3>
 <div class="wrong-add">
  <input id="wrongHanziInput" placeholder="한자 예: 学习">
  <input id="wrongPinyinInput" placeholder="병음 예: xuéxí">
  <input id="wrongMeaningInput" placeholder="뜻 예: 공부하다">
  <button id="addWrongWordBtn">+ 오답 단어 추가</button>
 </div>
</section>
</main>
